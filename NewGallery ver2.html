<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scattered Void Gallery | MokuSaku's Photo booth</title>
  <link rel="icon" href="images/Prof_icon_favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #000; }
    body { width: 100%; background: #000; overflow-y: scroll; overflow-x: hidden; }
    #three-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* --- Overlay UI --- */
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(14px);
      transition: opacity 0.6s ease; pointer-events: auto;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 4.2rem; color: #ffffff; margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(255,255,255,0.4);
    }
    #overlay .subtitle {
      color: #999; font-size: 1rem; letter-spacing: 0.25em;
      margin-bottom: 50px; text-transform: uppercase; font-weight: 300;
    }
    #overlay .start-btn {
      background: transparent; border: 1.5px solid #fff;
      color: #fff; padding: 18px 60px; font-size: 1.1rem;
      letter-spacing: 0.2em; cursor: pointer; border-radius: 30px;
      transition: all 0.4s ease; font-weight: 300;
      text-transform: uppercase;
    }
    #overlay .start-btn:hover {
      background: #fff; color: #000; box-shadow: 0 0 30px rgba(255,255,255,0.3);
    }
    #overlay .controls-info {
      margin-top: 50px; color: #666; font-size: 0.85rem;
      text-align: center; line-height: 2.4; letter-spacing: 0.1em;
    }
    #overlay .controls-info span { color: #aaa; }

    /* --- Category Toggle --- */
    #category-toggle {
      position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
      z-index: 60; display: flex; gap: 24px;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
      padding: 10px 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15);
      display: none;
    }
    #category-toggle button {
      background: none; border: none; color: #888; font-size: 0.9rem;
      letter-spacing: 0.2em; cursor: pointer; text-transform: uppercase;
      transition: color 0.3s ease; font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    #category-toggle button.active { color: #fff; font-weight: bold; }
    #category-toggle button:hover { color: #ddd; }

    /* --- Caption popup --- */
    #caption {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      z-index: 50; color: #fff; font-size: 0.9rem;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
      padding: 16px 32px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center; pointer-events: none;
      opacity: 0; transition: opacity 0.4s ease;
      max-width: 85vw; letter-spacing: 0.05em;
      line-height: 1.8; white-space: pre-line;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #caption.show { opacity: 1; }

    /* --- Back Button --- */
    #backBtn {
      position: fixed; top: 30px; left: 30px; z-index: 60;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2); color: #fff;
      padding: 12px 24px; font-size: 0.85rem;
      letter-spacing: 0.15em; cursor: pointer; border-radius: 30px;
      transition: all 0.3s ease; font-weight: 300;
      display: none;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-transform: uppercase;
    }
    #backBtn:hover {
      background: rgba(255,255,255,0.1); border-color: #fff;
    }

    /* --- Zoom Hint --- */
    #zoomHint {
      position: fixed; top: 30px; right: 30px; z-index: 60;
      color: rgba(255,255,255,0.6); font-size: 0.8rem;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: 0.15em; pointer-events: none; display: none;
      text-transform: uppercase; text-align: right; line-height: 1.6;
    }

    /* --- Scroll hint --- */
    #scrollHint {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 50; color: rgba(255,255,255,0.4); font-size: 0.75rem;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: 0.2em; pointer-events: none; display: none;
      animation: hintPulse 2.5s ease-in-out infinite;
      text-transform: uppercase;
    }
    @keyframes hintPulse {
      0%, 100% { opacity: 0.2; transform: translate(-50%, 0); }
      50% { opacity: 0.8; transform: translate(-50%, 5px); }
    }

    /* --- Loading --- */
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 200; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #000; color: #fff; font-size: 0.9rem;
      font-family: 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.25em;
      text-transform: uppercase;
    }
    #loading .spinner {
      width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 1s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite; margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .progress {
      width: 240px; height: 1px; background: rgba(255,255,255,0.1);
      margin-top: 20px; overflow: hidden;
    }
    #loading .progress-bar {
      width: 0%; height: 100%; background: #fff;
      transition: width 0.4s ease;
    }

    /* --- Cursor --- */
    body.gallery-active { cursor: default; }
    body.gallery-active canvas { cursor: crosshair; }
    body.is-focused canvas { cursor: grab; }
    body.is-focused.is-dragging canvas { cursor: grabbing; }

    /* --- Vignette --- */
    #vignette {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2; pointer-events: none;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.85) 120%);
    }

    /* --- Mobile Optimization --- */
    @media (max-width: 768px) {
      #overlay h1 { font-size: 2.8rem; }
      #overlay .subtitle { font-size: 0.8rem; margin-bottom: 30px; }
      #overlay .start-btn { padding: 14px 40px; font-size: 0.9rem; }
      #overlay .controls-info { margin-top: 30px; font-size: 0.75rem; line-height: 2; }
      #category-toggle { top: 20px; padding: 8px 16px; gap: 12px; flex-wrap: wrap; justify-content: center; width: 90%; max-width: 320px; }
      #category-toggle button { font-size: 0.75rem; }
      #backBtn { top: 20px; left: 20px; padding: 10px 16px; font-size: 0.75rem; }
      #zoomHint { top: 20px; right: 20px; font-size: 0.7rem; }
      #caption { bottom: 40px; font-size: 0.8rem; padding: 12px 24px; width: 90%; }
      #scrollHint { bottom: 20px; font-size: 0.65rem; }
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    Loading Void...
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <div id="overlay">
    <h1>Scattered Void</h1>
    <p class="subtitle">MokuSaku's Photo booth</p>
    <button class="start-btn" id="startBtn">Enter Gallery</button>
    <div class="controls-info">
      <span>Scroll / Swipe</span> to explore deep space<br>
      <span>Click / Tap</span> a photo to focus<br>
      <span>Wheel / Pinch</span> to zoom, <span>Drag</span> to pan
    </div>
  </div>

  <div id="category-toggle">
    <button id="btn-back-gallery">← Gallery</button>
    <button id="btn-snap" class="active">Snap</button>
    <button id="btn-portrait">Portrait</button>
  </div>

  <div id="vignette"></div>
  <div id="caption"></div>
  <button id="backBtn">← Back to Space</button>
  <div id="zoomHint">Wheel to Zoom<br>Drag to Pan</div>
  <div id="scrollHint">Scroll Down</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.164.1",
      "three/addons/": "https://esm.sh/three@0.164.1/examples/jsm/"
    }
  }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script type="module">
    import * as THREE from 'three';

    // =========================================================================
    //  Constants
    // =========================================================================
    const SCROLL_FACTOR = 0.02;
    const SCROLL_BASE_Z = 10;
    const Z_SPACING = 3.5;
    const LOAD_DISTANCE = 65;   // Distance at which to load high-res textures
    const UNLOAD_DISTANCE = 90; // Distance to dispose texture memory
    const EYE_HEIGHT = 2;

    // Zoom Constants
    const DEFAULT_FOCUS_DIST = 3.0;
    const MIN_ZOOM = 0.8;
    const MAX_ZOOM = 8.0;

    // =========================================================================
    //  State
    // =========================================================================
    let galleryActive = false;
    let focusedMesh = null;
    let isTweening = false;
    
    // Zoom and Pan state
    let currentFocusDist = DEFAULT_FOCUS_DIST;
    let isDragging = false;
    let dragDistance = 0;
    let previousMousePosition = { x: 0, y: 0 };
    let panOffset = { x: 0, y: 0 };

    // Explore pan state
    let explorePanX = 0;
    let isExploringDrag = false;
    let explorePreviousMousePosition = { x: 0, y: 0 };
    const MAX_EXPLORE_PAN_X = 15.0;

    // Data state
    let currentCategory = 'snap';
    let allPhotosData = [];
    let totalPhotos = 0;
    let isFirstLoad = true;

    const photoMeshes = [];
    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous');

    // =========================================================================
    //  Renderer & Scene setup
    // =========================================================================
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.domElement.id = 'three-canvas';
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#030303');
    scene.fog = new THREE.FogExp2('#030303', 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, EYE_HEIGHT, SCROLL_BASE_Z);

    // =========================================================================
    //  DOM refs
    // =========================================================================
    const overlay = document.getElementById('overlay');
    const captionEl = document.getElementById('caption');
    const backBtn = document.getElementById('backBtn');
    const scrollHint = document.getElementById('scrollHint');
    const zoomHint = document.getElementById('zoomHint');
    const progressBar = document.getElementById('progressBar');
    const loadingEl = document.getElementById('loading');
    const toggleBtnSnap = document.getElementById('btn-snap');
    const toggleBtnPortrait = document.getElementById('btn-portrait');

    // =========================================================================
    //  Scroll-driven & Zoom/Pan navigation
    // =========================================================================
    function getScrollZ() {
      return SCROLL_BASE_Z - window.scrollY * SCROLL_FACTOR;
    }

    // Standard Window Scroll (Navigation)
    window.addEventListener('scroll', () => {
      if (!galleryActive || isTweening || focusedMesh) return;
      camera.position.z = getScrollZ();
    }, { passive: true });

    // Wheel Event for Zooming when Focused
    window.addEventListener('wheel', (e) => {
      if (focusedMesh && !isTweening) {
        e.preventDefault(); // Stop native scrolling behavior completely during focus
        
        // Adjust zoom distance based on wheel delta
        currentFocusDist += e.deltaY * 0.004;
        currentFocusDist = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, currentFocusDist));
        
        // Apply zoom to camera smoothly
        gsap.to(camera.position, {
          z: focusedMesh.userData.worldPos.z + currentFocusDist,
          duration: 0.3,
          ease: 'power2.out'
        });
      }
    }, { passive: false });

    // Drag to Pan
    window.addEventListener('mousedown', (e) => {
      if (focusedMesh && !isTweening) {
        isDragging = true;
        dragDistance = 0;
        previousMousePosition = { x: e.clientX, y: e.clientY };
        document.body.classList.add('is-dragging');
      } else if (!focusedMesh && galleryActive && !isTweening) {
        isExploringDrag = true;
        explorePreviousMousePosition = { x: e.clientX, y: e.clientY };
        document.body.classList.add('is-dragging');
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging && focusedMesh && !isTweening) {
        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;
        
        dragDistance += Math.abs(deltaX) + Math.abs(deltaY);
        
        // Pan sensitivity scales with zoom
        const panSpeed = currentFocusDist * 0.0015;
        
        panOffset.x -= deltaX * panSpeed;
        panOffset.y += deltaY * panSpeed; // Y is inverted in 3D relative to screen
        
        // Clamp panning so we don't lose the photo
        const maxPan = 5.0; 
        panOffset.x = Math.max(-maxPan, Math.min(maxPan, panOffset.x));
        panOffset.y = Math.max(-maxPan, Math.min(maxPan, panOffset.y));
        
        // Update camera position
        camera.position.x = focusedMesh.userData.worldPos.x + panOffset.x;
        camera.position.y = focusedMesh.userData.worldPos.y + panOffset.y;
        
        previousMousePosition = { x: e.clientX, y: e.clientY };
      } else if (isExploringDrag && !focusedMesh && galleryActive && !isTweening) {
        const deltaX = e.clientX - explorePreviousMousePosition.x;
        explorePanX -= deltaX * 0.01;
        explorePanX = Math.max(-MAX_EXPLORE_PAN_X, Math.min(MAX_EXPLORE_PAN_X, explorePanX));
        explorePreviousMousePosition = { x: e.clientX, y: e.clientY };
      }
    });

    window.addEventListener('mouseup', () => { 
      isDragging = false; 
      isExploringDrag = false;
      document.body.classList.remove('is-dragging');
    });
    window.addEventListener('mouseleave', () => { 
      isDragging = false; 
      isExploringDrag = false;
      document.body.classList.remove('is-dragging');
    });

    // Touch Events for Mobile (Pan & Zoom)
    let initialTouchDist = 0;

    window.addEventListener('touchstart', (e) => {
      if (focusedMesh && !isTweening) {
        if (e.touches.length === 1) {
          isDragging = true;
          dragDistance = 0;
          previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          isDragging = false;
          initialTouchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      } else if (!focusedMesh && galleryActive && !isTweening) {
        if (e.touches.length === 1) {
          isExploringDrag = true;
          explorePreviousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (focusedMesh && !isTweening) {
        e.preventDefault(); // Stop native scrolling
        if (e.touches.length === 1 && isDragging) {
          const deltaX = e.touches[0].clientX - previousMousePosition.x;
          const deltaY = e.touches[0].clientY - previousMousePosition.y;
          
          dragDistance += Math.abs(deltaX) + Math.abs(deltaY);
          const panSpeed = currentFocusDist * 0.0015;
          
          panOffset.x -= deltaX * panSpeed;
          panOffset.y += deltaY * panSpeed;
          
          const maxPan = 5.0; 
          panOffset.x = Math.max(-maxPan, Math.min(maxPan, panOffset.x));
          panOffset.y = Math.max(-maxPan, Math.min(maxPan, panOffset.y));
          
          camera.position.x = focusedMesh.userData.worldPos.x + panOffset.x;
          camera.position.y = focusedMesh.userData.worldPos.y + panOffset.y;
          
          previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const delta = initialTouchDist - dist;
          initialTouchDist = dist;
          
          currentFocusDist += delta * 0.015;
          currentFocusDist = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, currentFocusDist));
          
          gsap.to(camera.position, {
            z: focusedMesh.userData.worldPos.z + currentFocusDist,
            duration: 0.2,
            ease: 'power2.out'
          });
        }
      } else if (isExploringDrag && !focusedMesh && galleryActive && !isTweening) {
        if (e.touches.length === 1) {
          const deltaX = e.touches[0].clientX - explorePreviousMousePosition.x;
          explorePanX -= deltaX * 0.015;
          explorePanX = Math.max(-MAX_EXPLORE_PAN_X, Math.min(MAX_EXPLORE_PAN_X, explorePanX));
          explorePreviousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      isDragging = false;
      isExploringDrag = false;
    });

    // =========================================================================
    //  Enter gallery & Category Toggle
    // =========================================================================
    document.getElementById('startBtn').addEventListener('click', () => {
      overlay.classList.add('hidden');
      galleryActive = true;
      document.body.classList.add('gallery-active');
      document.getElementById('category-toggle').style.display = 'flex';
      scrollHint.style.display = 'block';
      setTimeout(() => { scrollHint.style.display = 'none'; }, 6000);
    });

    document.getElementById('btn-back-gallery').addEventListener('click', () => {
      window.location.href = 'gallery.html';
    });

    toggleBtnSnap.addEventListener('click', () => switchCategory('snap'));
    toggleBtnPortrait.addEventListener('click', () => switchCategory('portrait'));

    function switchCategory(category) {
      if (currentCategory === category || isTweening) return;
      isTweening = true;
      
      toggleBtnSnap.classList.toggle('active', category === 'snap');
      toggleBtnPortrait.classList.toggle('active', category === 'portrait');
      
      if (focusedMesh) {
        returnToScroll();
      }

      const delay = focusedMesh ? 1.0 : 0;

      // Animate existing photos flying off to the right
      // Only animate a subset for performance and a cleaner transition
      const groups = photoMeshes.map(m => m.userData.group);
      if (groups.length > 0) {
        const animateCount = Math.min(groups.length, 12);
        groups.forEach((group, i) => {
          if (i < animateCount) {
            gsap.to(group.position, {
              x: group.position.x + 40,
              duration: 0.6,
              delay: delay + i * 0.03,
              ease: 'power2.in'
            });
            gsap.to(group.rotation, {
              z: group.rotation.z + 0.5,
              duration: 0.6,
              delay: delay + i * 0.03,
              ease: 'power2.in'
            });
          } else {
            // Instantly move others
            group.position.x += 40;
          }
        });

        // After exit animation completes, load new category
        const totalOutDuration = delay + (animateCount * 0.03) + 0.6;
        setTimeout(() => {
          loadCategory(category, true);
        }, totalOutDuration * 1000);
      } else {
        loadCategory(category, true);
      }
    }

    function animateEntrance() {
      const groups = photoMeshes.map(m => m.userData.group);
      const animateCount = Math.min(groups.length, 20); // Animate first 20 for impact
      
      groups.forEach((group, i) => {
        const targetX = group.position.x;
        const targetRotZ = group.rotation.z;

        if (i < animateCount) {
          // Set starting position for animation
          group.position.x = targetX - 40;
          group.rotation.z = targetRotZ - 0.5;

          gsap.to(group.position, {
            x: targetX,
            duration: 0.8,
            delay: i * 0.03,
            ease: 'power2.out'
          });
          gsap.to(group.rotation, {
            z: targetRotZ,
            duration: 0.8,
            delay: i * 0.03,
            ease: 'power2.out'
          });
        }
      });

      // Unlock tweening after the land animation is reasonably complete
      const totalInDuration = (animateCount * 0.03) + 1.0;
      setTimeout(() => { isTweening = false; }, totalInDuration * 1000);
    }

    // =========================================================================
    //  Lighting
    // =========================================================================
    function buildLighting() {
      scene.add(new THREE.AmbientLight('#ffffff', 0.2));
      
      const dirLight = new THREE.DirectionalLight('#ffffff', 1.5);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      const hemiLight = new THREE.HemisphereLight('#111111', '#222233', 1.0);
      scene.add(hemiLight);
    }

    // =========================================================================
    //  Textures for Bokeh & Aperture
    // =========================================================================
    function createBokehTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, 'rgba(255,255,255,1.0)');
      gradient.addColorStop(0.7, 'rgba(255,255,255,0.8)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(64, 64, 64, 0, Math.PI * 2);
      ctx.fill();
      return new THREE.CanvasTexture(canvas);
    }

    function createApertureTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      const sides = 9; // 9-blade aperture
      const radius = 30;
      const center = 32;
      for (let i = 0; i < sides; i++) {
        const angle = (i * 2 * Math.PI / sides) - Math.PI / 2;
        const x = center + radius * Math.cos(angle);
        const y = center + radius * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      return new THREE.CanvasTexture(canvas);
    }

    // =========================================================================
    //  Optical Bokeh Backdrop
    // =========================================================================
    function buildBokehBackdrop() {
      const count = 150;
      const group = new THREE.Group();
      
      const colorOrange = new THREE.Color('#ff4d00');
      // Made indigo brighter and more saturated so it's visible with additive blending
      const colorIndigo = new THREE.Color('#4a4a8a'); 
      
      const texture = createBokehTexture();
      
      const matOrange = new THREE.SpriteMaterial({
        map: texture,
        color: colorOrange,
        transparent: true,
        opacity: 0.25,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false // Disable fog so it shines through the distance
      });
      const matIndigo = new THREE.SpriteMaterial({
        map: texture,
        color: colorIndigo,
        transparent: true,
        opacity: 0.20,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false // Disable fog so it shines through the distance
      });

      const positions = new Float32Array(count * 3);
      
      for (let i = 0; i < count; i++) {
        const isOrange = Math.random() < 0.05; // 5% orange
        const sprite = new THREE.Sprite(isOrange ? matOrange : matIndigo);
        
        // Scatter widely, very far in the background
        const x = (Math.random() - 0.5) * 800;
        const y = (Math.random() - 0.5) * 500;
        const z = SCROLL_BASE_Z - 300 - Math.random() * 600;
        
        sprite.position.set(x, y, z);
        
        // Massive world-scale size for true bokeh feeling
        const scale = 80.0 + Math.random() * 200.0;
        sprite.scale.set(scale, scale, 1);
        
        group.add(sprite);
        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;
      }
      
      group.userData.positions = positions;
      scene.add(group);
      return group;
    }

    // =========================================================================
    //  Grid & Floor (Tactical Grid)
    // =========================================================================
    function buildGrid() {
      const size = 1000;
      const divisions = 100;
      const gridHelper = new THREE.GridHelper(size, divisions, 0x222222, 0x181818);
      
      const floorY = -4.0;
      gridHelper.position.y = floorY;
      gridHelper.material.transparent = true;
      gridHelper.material.opacity = 0.2;

      // Distance fading shader
      const fadeShader = (shader) => {
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <fog_fragment>',
          `
          #include <fog_fragment>
          // Calculate linear distance from camera
          float depthDist = 1.0 / gl_FragCoord.w;
          // Fade out between 20 and 250 units away
          float alphaDecay = 1.0 - smoothstep(20.0, 250.0, depthDist);
          gl_FragColor.a *= alphaDecay;
          `
        );
      };

      gridHelper.onBeforeCompile = fadeShader;
      scene.add(gridHelper);

      // Intersection points (Aperture Intersections)
      const ptsArr = [];
      const halfSize = size / 2;
      const step = size / divisions;
      for (let i = 0; i <= divisions; i++) {
        for (let j = 0; j <= divisions; j++) {
          ptsArr.push(-halfSize + i * step, 0, -halfSize + j * step);
        }
      }
      const ptsGeo = new THREE.BufferGeometry();
      ptsGeo.setAttribute('position', new THREE.Float32BufferAttribute(ptsArr, 3));
      
      const ptsMat = new THREE.PointsMaterial({
        color: 0xff4d00,
        size: 0.25,
        transparent: true,
        opacity: 0.15,
        map: createApertureTexture(),
        sizeAttenuation: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      ptsMat.onBeforeCompile = fadeShader;
      
      const gridPoints = new THREE.Points(ptsGeo, ptsMat);
      gridPoints.position.y = floorY;
      scene.add(gridPoints);
    }

    // =========================================================================
    //  Photo Placeholder & Lazy Loading
    // =========================================================================
    const placeholderMat = new THREE.MeshStandardMaterial({ 
      color: '#080808', roughness: 0.9, metalness: 0.1 
    });

    function createPhotoPlaceholder(photoData, position) {
      const group = new THREE.Group();
      group.position.set(...position);

      group.rotation.x = (Math.random() - 0.5) * 0.1;
      group.rotation.y = (Math.random() - 0.5) * 0.15;
      group.rotation.z = (Math.random() - 0.5) * 0.05;

      const photoW = 3.0, photoH = 2.0;

      const frameMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.2 });
      const frame = new THREE.Mesh(new THREE.PlaneGeometry(photoW + 0.1, photoH + 0.1), frameMat);
      frame.position.z = -0.01;
      group.add(frame);

      const photoGeo = new THREE.PlaneGeometry(photoW, photoH);
      const photoMat = placeholderMat.clone();
      const photoMesh = new THREE.Mesh(photoGeo, photoMat);
      
      photoMesh.userData = {
        caption: photoData.caption,
        textureUrl: photoData.src,
        loaded: false,
        loading: false,
        group: group,
        frame: frame,
        originalRot: { x: group.rotation.x, y: group.rotation.y, z: group.rotation.z },
        worldPos: new THREE.Vector3(...position)
      };
      
      group.add(photoMesh);
      photoMeshes.push(photoMesh);
      scene.add(group);
      
      // Removed PointLight to eliminate white glare reflection
    }

    function loadTextureForMesh(mesh) {
      if (mesh.userData.loaded || mesh.userData.loading) return;
      mesh.userData.loading = true;

      textureLoader.load(mesh.userData.textureUrl, (texture) => {
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = true;

        const aspect = texture.image.width / texture.image.height;
        // Enlarged photos
        const photoW = aspect >= 1 ? 4.5 : 3.5;
        const photoH = photoW / aspect;

        mesh.geometry.dispose();
        mesh.geometry = new THREE.PlaneGeometry(photoW, photoH);

        mesh.material.dispose();
        mesh.material = new THREE.MeshStandardMaterial({
          map: texture, 
          roughness: 1.0,  // Increased to remove glare
          metalness: 0.0,  // Removed metalness
          emissive: new THREE.Color('#ffffff'),
          emissiveMap: texture, 
          emissiveIntensity: 0.08 // Slight self-illumination instead of external light
        });

        const ud = mesh.userData;
        ud.frame.geometry.dispose();
        ud.frame.geometry = new THREE.PlaneGeometry(photoW + 0.1, photoH + 0.1);

        ud.loaded = true;
        ud.loading = false;

        if (isFirstLoad) {
          initialLoadCount++;
          const pct = Math.min(100, (initialLoadCount / initialLoadTotal) * 100);
          progressBar.style.width = pct + '%';
          if (initialLoadCount >= initialLoadTotal) {
            loadingEl.style.display = 'none';
            isFirstLoad = false;
          }
        }
      }, undefined, () => {
        mesh.userData.loading = false;
        if (isFirstLoad) {
          initialLoadCount++;
          if (initialLoadCount >= initialLoadTotal) {
            loadingEl.style.display = 'none';
            isFirstLoad = false;
          }
        }
      });
    }

    function unloadTextureForMesh(mesh) {
      if (!mesh.userData.loaded) return;
      if (mesh.material.map) {
        mesh.material.map.dispose();
        mesh.material.map = null;
      }
      if (mesh.material.emissiveMap) {
        mesh.material.emissiveMap = null;
      }
      mesh.material.dispose();
      mesh.material = placeholderMat.clone();
      mesh.userData.loaded = false;
      mesh.userData.loading = false;
    }

    // =========================================================================
    //  Load photo data from JSON
    // =========================================================================
    let initialLoadCount = 0;
    let initialLoadTotal = 0;

    async function initPhotos() {
      try {
        const resp = await fetch('photos.json');
        if (!resp.ok) throw new Error('Network response was not ok');
        const data = await resp.json();
        
        // Store the categories separately
        allPhotosData = data; 
        
        loadCategory('snap');
      } catch (err) {
        console.error('Failed to load photos:', err);
        loadingEl.style.display = 'none';
      }
    }

    function clearGallery() {
      photoMeshes.forEach(mesh => {
        scene.remove(mesh.userData.group);
        if (mesh.userData.loaded && mesh.material.map) {
          mesh.material.map.dispose();
        }
        mesh.material.dispose();
        mesh.geometry.dispose();
      });
      photoMeshes.length = 0;
    }

    function loadCategory(category, animate = false) {
      currentCategory = category;
      clearGallery();

      // Get photos for selected category
      const filteredPhotos = allPhotosData[category] || [];

      totalPhotos = filteredPhotos.length;

      filteredPhotos.forEach((photo, i) => {
        const side = i % 2 === 0 ? 1 : -1;
        // Tightened spread: moved closer to center (2.5 to 8 units away)
        const baseX = side * (2.5 + Math.random() * 5.5); 
        // More vertical variation
        const baseY = EYE_HEIGHT + (Math.random() - 0.4) * 8; 
        
        const z = SCROLL_BASE_Z - 8 - (i * Z_SPACING); 
        
        createPhotoPlaceholder(photo, [baseX, baseY, z]);
      });

      // Reset Camera & Scroll
      window.scrollTo(0, 0);
      explorePanX = 0;
      camera.position.set(0, EYE_HEIGHT, SCROLL_BASE_Z);
      panOffset = { x: 0, y: 0 };

      // Determine load total for current view
      const startZ = camera.position.z;
      // Load based on distance, but ensure at least the first 16 photos are part of the initial loading screen
      initialLoadTotal = photoMeshes.filter((m, i) => 
        i < 16 || Math.abs(m.userData.worldPos.z - startZ) < LOAD_DISTANCE
      ).length;
      initialLoadCount = 0;

      if (initialLoadTotal === 0 && isFirstLoad) {
        loadingEl.style.display = 'none';
        isFirstLoad = false;
      }

      // Manually trigger texture manage to start loading
      manageTextures();

      // Update document scroll height
      const totalZDepth = totalPhotos * Z_SPACING + 15;
      const totalScroll = totalZDepth / SCROLL_FACTOR;
      document.body.style.height = (window.innerHeight + totalScroll) + 'px';

      // Animate entrance if switching categories
      if (animate) {
        animateEntrance();
      } else {
        isTweening = false;
      }
    }

    // =========================================================================
    //  Raycaster + Click-to-Focus
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    raycaster.far = 30;

    renderer.domElement.addEventListener('click', (e) => {
      if (!galleryActive || isTweening) return;

      // Ignore click if user was dragging
      if (focusedMesh && dragDistance > 10) {
        dragDistance = 0;
        return;
      }

      const mouse = new THREE.Vector2(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1
      );
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(photoMeshes, false);

      if (focusedMesh) {
        returnToScroll();
        return;
      }

      if (hits.length > 0 && hits[0].object.userData.loaded) {
        focusOnPhoto(hits[0].object);
      }
    });

    function focusOnPhoto(mesh) {
      isTweening = true;
      focusedMesh = mesh;

      // Calculate required zoom distance to fit the photo based on aspect ratio
      const photoW = mesh.geometry.parameters.width;
      const photoH = mesh.geometry.parameters.height;
      const aspect = window.innerWidth / window.innerHeight;
      
      const fovRad = camera.fov * (Math.PI / 180);
      const distY = (photoH / 2) / Math.tan(fovRad / 2);
      
      const hFovRad = 2 * Math.atan(Math.tan(fovRad / 2) * aspect);
      const distX = (photoW / 2) / Math.tan(hFovRad / 2);
      
      // Select the maximum required distance and add a 15% margin
      currentFocusDist = Math.max(distX, distY) * 1.15;
      currentFocusDist = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, currentFocusDist));

      panOffset = { x: 0, y: 0 };
      dragDistance = 0;
      
      const wp = mesh.userData.worldPos;
      const group = mesh.userData.group;

      document.body.style.overflow = 'hidden';
      document.body.classList.add('is-focused');

      captionEl.textContent = mesh.userData.caption;
      captionEl.classList.add('show');
      backBtn.style.display = 'block';
      zoomHint.style.display = 'block';

      gsap.to(group.rotation, {
        x: 0, y: 0, z: 0,
        duration: 1.0, ease: 'power2.out'
      });

      gsap.to(camera.position, {
        x: wp.x, y: wp.y, z: wp.z + currentFocusDist,
        duration: 1.2, ease: 'power2.inOut',
        onComplete: () => { isTweening = false; }
      });
    }

    function returnToScroll() {
      if (!focusedMesh) return;
      isTweening = true;
      
      const group = focusedMesh.userData.group;
      const oRot = focusedMesh.userData.originalRot;
      gsap.to(group.rotation, {
        x: oRot.x, y: oRot.y, z: oRot.z,
        duration: 1.0, ease: 'power2.out'
      });

      focusedMesh = null;

      document.body.style.overflow = 'scroll';
      document.body.style.overflowX = 'hidden';
      document.body.classList.remove('is-focused');
      document.body.classList.remove('is-dragging');

      captionEl.classList.remove('show');
      backBtn.style.display = 'none';
      zoomHint.style.display = 'none';

      const returnZ = getScrollZ();
      const returnX = (Math.sin(window.scrollY * 0.002) * 0.5) + explorePanX;
      const returnY = EYE_HEIGHT + Math.cos(window.scrollY * 0.0015) * 0.3;

      gsap.to(camera.position, {
        x: returnX, y: returnY, z: returnZ,
        duration: 1.2, ease: 'power2.inOut',
        onComplete: () => { isTweening = false; }
      });
    }

    backBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      returnToScroll();
    });

    // =========================================================================
    //  Texture Management (lazy load / unload)
    // =========================================================================
    function manageTextures() {
      const camZ = camera.position.z;
      for (const mesh of photoMeshes) {
        const dist = Math.abs(mesh.userData.worldPos.z - camZ);
        if (dist < LOAD_DISTANCE) {
          loadTextureForMesh(mesh);
        } else if (dist > UNLOAD_DISTANCE && mesh.userData.loaded) {
          unloadTextureForMesh(mesh);
        }
      }
    }

    // =========================================================================
    //  Animation Loop
    // =========================================================================
    const clock = new THREE.Clock();
    let texManageTimer = 0;
    let bokehParticles = null;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      texManageTimer += delta;
      if (texManageTimer > 0.3) {
        texManageTimer = 0;
        manageTextures();
      }

      if (bokehParticles) {
        const pos = bokehParticles.userData.positions;
        const time = clock.elapsedTime;
        for (let i = 0; i < bokehParticles.children.length; i++) {
          const sprite = bokehParticles.children[i];
          sprite.position.x = pos[i * 3] + Math.sin(time * 0.05 + i) * 15.0;
          sprite.position.y = pos[i * 3 + 1] + Math.cos(time * 0.05 + i) * 15.0;
        }
      }

      if (galleryActive && !focusedMesh && !isTweening) {
        camera.position.x = (Math.sin(window.scrollY * 0.002) * 0.5) + explorePanX;
        camera.position.y = EYE_HEIGHT + Math.cos(window.scrollY * 0.0015) * 0.3;
      }

      renderer.render(scene, camera);
    }

    // =========================================================================
    //  Resize
    // =========================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    //  Init
    // =========================================================================
    buildLighting();
    bokehParticles = buildBokehBackdrop();
    initPhotos();
    animate();
  </script>
</body>
</html>
